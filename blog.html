---
layout: default
title: Blog Archive
permalink: /blog/
---

<main class="content" role="main">
    <div class="cf frame">
      {% for post in site.posts %}
        <article class="post" itemscope itemtype="http://schema.org/BlogPosting" role="article">
          <div class="article-item">
            <header class="post-header">
              <meta itemprop="author" content="{{ post.author }}" />
              <meta itemprop="publisher" content="{{ site.author }}" />
              <h2 class="post-title" itemprop="name"><a href="{{ post.url }}" itemprop="url">{{ post.title }}</a></h2>
              <meta itemprop="headline" content="{{ post.title }}" />
            </header>
            <section class="post-excerpt" itemprop="description">
              <p>{{ post.excerpt | strip_html | truncatewords: 50 }}</p>
            </section>
            <div class="post-meta">
              <time itemprop="datePublished" datetime="{{ post.date | date_to_long_string }}">{{ post.date | date_to_long_string }}</time>
              <meta itemprop="dateModified" content="{{ post.date | date_to_xmlschema }}" />

            </div>
          </div>
        </article>
      {% endfor %}
    </div>
</main>
