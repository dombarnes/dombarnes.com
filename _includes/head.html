<head>
  <meta charset="utf-8">
  <!-- (1) Optimize for mobile versions: http://goo.gl/EOpFl -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- (1) force latest IE rendering engine: bit.ly/1c8EiC9 -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>{% if page.title %}{{ page.title | append: ' | ' | append: site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}" />

  <meta name="HandheldFriendly" content="True" />
  <meta name="MobileOptimized" content="320" />
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <link href="{{ site.baseurl | prepend: site.url }}/feed.xml" rel="alternate" title="{{ site.title }} - Atom" type="application/atom+xml">
  <link href="{{ site.baseurl | prepend: site.url }}/rss.xml" rel="alternate" title="{{ site.title }} - RSS" type="application/rss+xml">

  {% include social.html %}
  {% if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />{% endif %}


  <link rel="shortcut icon" href="{{ " /assets/images/favicon.png" | prepend: site.baseurl }}" type="image/png" />
  <link rel="stylesheet" href="https://brick.a.ssl.fastly.net/Linux+Libertine:400,400i,700,700i/Open+Sans:400,400i,700,700i">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.min.js"></script>
  <link rel="stylesheet" type="text/css" media="screen" href="{{ " /assets/css/styles.css" | prepend: site.baseurl }}" />
  <link rel="stylesheet" type="text/css" media="print" href="{{ " /css/print.css" | prepend: site.baseurl }}" />

  {% if page.layout != 'home' %}
  <script type="application/ld+json">
    {
    "@context": "http://schema.org",
    "@type": "Blog",
    "headline": "{{ page.title }}",
    "mainEntityOfPage":{
      "@type":"WebPage",
      "@id":"{{ site.url }}{{ page.url }}"
    },
    "url": "{{ site.url }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author }}"
    },
    "publisher": {
      "@type": "Person",
      "name": "{{ site.author }}",
      "image": "{{ site.url }}{{ site.author_image }}"
      }
  }
  </script>
  {% else %}
  <script type="application/ld+json">
    {
    "@context": "http://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title }}",
    "mainEntityOfPage":{
      "@type":"WebPage",
      "@id":"{{ site.url }}{{ page.url }}"
    },
    "url": "{{ site.url }}{{ page.url }}",
    "dateCreated": "{{ page.date }}",
    "author": {
      "@type": "Person",
      "name": "{{ site.author }}"
    },
    "datePublished": "{{ page.date }}",
    "dateModified": "{{ page.date }}",
    {% if page.image %}
     "image": "{{ page.image }},"
    {% endif %}
    "publisher": {
      "@type": "Person",
      "name": "{{ site.author }}",
      "image": "{{ site.url }}{{ site.author_image }}"
      }
  }
  </script>
  {% endif %}
</head>
